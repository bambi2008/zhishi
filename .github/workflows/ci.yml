name: CI

on:
  push:
    branches:
      - master
      - agent/zhishi-mvp
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python scripts/verify_bazi.py --cases 100 --seed 20260807

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo install --check

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag zhishi-api:test services/api
      - name: Smoke test container
        shell: bash
        run: |
          docker run --detach --name zhishi-api --publish 8000:10000 zhishi-api:test
          trap 'docker logs zhishi-api; docker rm --force zhishi-api' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
